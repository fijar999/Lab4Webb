<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kontak - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <header>
            <h1>Kontak</h1>
        </header>

        <nav>
            <a href="home.html">Home</a>
            <a href="artikel.html">Artikel</a>
            <a href="about.html">About</a>
            <a href="kontak.html" class="active">Kontak</a>
        </nav>

        <section id="hero">
            <h1>Hubungi saya</h1>
            <p>Silahkan isi formulir berikut untuk mengirimkan pertanyaan, saran atau pesan.</p>
        </section>

        <section id="main">
            <h2>Form kontak</h2>
            <form class="kontak-form" action="#" method="post">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="masukkan nama lengkap" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="masukkan alamat email" required>

                <label for="subjek">subjek</label>
                <input type="text" id="subjek" name="subjek" placeholder="masukkan subjek pesan" required>

                <label for="pesan">Pesan</label>
                <textarea id="tuliskan pesan kamu" required></textarea>

                <button type="submit" class="btn btn-default">
                    kirim pesan
                </button>

            </form>
        </section>

        <footer>
            <p>&copy; 2026 - universitas pelita bangsa</p>
        </footer>
    </div>
    
</body>
</html>
